name: Gerar APK Auto Video Afiliado
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: unzip -q AutoVideo-Afiliado-GitHub-Pronto.zip -d projeto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: projeto
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AutoVideo-Afiliado-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
